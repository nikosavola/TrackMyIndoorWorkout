name: Flutter Test & Build
on: [push, pull_request]
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  flutter_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin an exact version instead of floating on channel: 'stable'.
          # A floating channel silently picks up upstream Flutter/Dart SDK
          # releases, which can break the build with no warning (see the
          # IconData `final class` fix in lib/ui/parts/flutter_brand_icons.dart,
          # caused by exactly this kind of unpinned upgrade).
          flutter-version: '3.44.8'
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Mock Secret File
        run: cp lib/secret.mock.dart lib/secret.dart
      - name: Format files
        run: dart format --set-exit-if-changed .
      - name: Analyze files
        run: flutter analyze .
      - name: Run the tests
        run: flutter test --dart-define=testing_mode=true
      # NOTE: integration_test execution is intentionally not run in CI here
      # since this runner has no device/emulator available. Tracked separately.
      - name: Build App Bundle (debug)
        run: flutter build appbundle --debug

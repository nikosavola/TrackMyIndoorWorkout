name: Flutter Test & Build
on: [push, pull_request]
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  flutter_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Mock Secret File
        run: cp lib/secret.mock.dart lib/secret.dart
      - name: Format files
        run: dart format --set-exit-if-changed .
      - name: Analyze files
        run: flutter analyze .
      - name: Run the tests
        run: flutter test --coverage --dart-define=testing_mode=true
      - name: Upload coverage to Codecov
        # NOTE: requires a CODECOV_TOKEN secret to be added to the repository settings.
        # fail_ci_if_error is false so the workflow doesn't hard-fail while that's pending.
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      #- name: Build App Bundle (debug)
      #  run: flutter build appbundle
